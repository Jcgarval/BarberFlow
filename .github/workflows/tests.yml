name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Versión fija (en vez de ubuntu-latest) para que un cambio de GitHub no rompa las pruebas
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar las pruebas con cobertura (falla si baja del 90 %)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: Resumen de cobertura en la página de la ejecución
        if: always()
        run: |
          echo "## Cobertura de las pruebas" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
